{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>All Blog Posts</title>
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>

<body>

<h1 class="blog-title">All Blog Posts</h1>
<a href="{% url 'home' %}" class="home-btn">
    ← Back to Home
</a>

<section class="blog">

    <div class="blog-section">

        {% for post in posts %}

        <a href="{% url 'blog_detail' post.pk %}"
           class="post"
           style="--bg: url('{{ post.image.url }}')">

            <h2>{{ post.title }}</h2>

            <p>{{ post.content|truncatewords:25 }}</p>

            <span class="read-more">
                Read More →
            </span>

        </a>

        {% empty %}
            <p class="empty">No blogs available.</p>
        {% endfor %}

    </div>

</section>

</body>
</html>
